name: Container image

# Publishes the self-hosting image to the GitHub Container Registry, so that running a
# copy does not mean building one, and so that app stores which ask for a maintained
# multi-architecture image have one to point at.
#
#   ghcr.io/jurecki007/nyxiontech-tools:edge      every push to master
#   ghcr.io/jurecki007/nyxiontech-tools:latest    every published release
#   ghcr.io/jurecki007/nyxiontech-tools:1.1.0     every published release
#   ghcr.io/jurecki007/nyxiontech-tools:sha-1a2b3c4   every build, and never moves
#
# The three names above are all moving tags: what :edge or :latest points at changes
# under anyone pinning them. The commit tag is the one that does not move, which is what
# an app store or a server that wants a reproducible install should pin, together with
# the digest it resolves to.
#
# The site is static and the deploy stage runs no commands, so the npm build happens once
# on the runner's own architecture and only the nginx layer differs per platform (see the
# Dockerfile). No emulation, no cross compilation, identical files on both.
#
# Nothing is pushed until an image has been built, started and asked for real pages, so a
# broken image fails here rather than on somebody else's server.
#
# GitHub creates the package private on the first run. Making it public is a one-off
# change in the repository's package settings; until then `docker pull` asks for a login.

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nyxiontech-pdf-tools:probe
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ask it for a page, a Polish page, a guide and a missing address
        run: |
          docker run -d --name probe -p 8080:80 nyxiontech-pdf-tools:probe
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/info
          curl -fsS -o /dev/null http://localhost:8080/merge-pdf
          curl -fsS -o /dev/null http://localhost:8080/pl/polacz-pdf
          curl -fsS -o /dev/null http://localhost:8080/guides
          curl -fsS -o /dev/null http://localhost:8080/pl/poradniki
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = 404
          docker rm -f probe

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=sha

      - name: Build both architectures and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
