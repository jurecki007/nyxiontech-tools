name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Nothing but this job stops docker-compose.yml drifting away from the Dockerfile.
  # A self-hosted copy that will not start, or that sits there marked unhealthy, is
  # worse than shipping no compose file at all, and neither shows up in any other test.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose up -d --build
      - name: Wait for the container's own health check to pass
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nyxiontech-pdf-tools)
            if [ "$status" = healthy ]; then echo "healthy after about $((i * 5))s"; exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 5
          done
          echo "The container never became healthy."
          docker inspect --format '{{json .State.Health}}' nyxiontech-pdf-tools
          docker compose logs
          exit 1
      - name: Serve a page, a Polish page and a missing one
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/info
          curl -fsS -o /dev/null http://localhost:8080/guides/split-pdf-without-uploading
          curl -fsS -o /dev/null http://localhost:8080/pl/polacz-pdf
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = 404
      - if: always()
        run: docker compose down

  # Builds the Windows app (without installers, so no signing key is needed) and
  # runs its smoke tests, so desktop problems show up in PRs and not only at release.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Show the WebView2 runtime the app will use
        shell: pwsh
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object name, pv
          Get-Item src-tauri/target/release/nyxiontech-pdf-tools.exe | Select-Object Name, Length
      # On GitHub's Windows runners the app starts but WebView2 never opens the
      # debugging port the tests drive it through (it does locally). Until that is
      # solved the smoke tests run for information only; run them locally before a
      # release (npm run test:desktop). The build above is still required.
      - run: npm run test:desktop
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-test-results
          path: test-results
          retention-days: 7

  # A documented image tag that is not in the registry turns the README's one runnable
  # self-hosting command into "manifest unknown" for whoever copies it. That is exactly
  # what happened to `:latest`, which the publishing workflow creates only for a published
  # release: it was documented before any release had created it. Nothing else in this
  # repository looks at the registry, so nothing else would have noticed.
  image-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No dependencies, so no install: the check is plain node and an anonymous registry read.
      - run: npm run images:check
