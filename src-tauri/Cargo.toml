[package]
name = "nyxiontech-pdf-tools"
version = "1.2.0"
description = "Nyxiontech PDF Tools desktop app"
authors = ["Nyxiontech <https://nyxiontech.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/jurecki007/nyxiontech-tools"
homepage = "https://nyxiontech.com"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
percent-encoding = "2.3"
serde_json = "=1.0.154"
tauri-plugin-process = "=2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.14.1"
